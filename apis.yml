name: WizerMe
description: WizerMe (Wizer) is an edtech platform used by more than 700,000 teachers to build interactive,
  self-grading digital worksheets. Educators turn existing PDFs and documents into engaging assessments with
  multiple-choice, video, audio, open-response, and puzzle question types, record video or audio instructions,
  apply differentiation rules, monitor student work in real time, schedule availability and time limits, and
  sync grades with Google Classroom. Students submit answers as text, audio, or video. Wizer offers a free tier
  (Wizer Create) and a premium tier (Wizer Boost) plus school and district plans, and is a 500 Global portfolio
  company. No public API, developer portal, or machine-readable API surface is currently published.
